<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibe Design Studio - Protected Project Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="tag">🚀 Client Confidential</div>
      <h1>Vibe Design Studio Showcase</h1>
      <p>This is a confidential preview project protected behind an access-controlled share link generated by Small Software Cloud.</p>
      <div class="stats">
        <div class="stat-box">
          <div class="num">99.9%</div>
          <div class="label">Reliability</div>
        </div>
        <div class="stat-box">
          <div class="num">0ms</div>
          <div class="label">Leak Vector</div>
        </div>
        <div class="stat-box">
          <div class="num">1-Click</div>
          <div class="label">Revocation</div>
        </div>
      </div>
      <button id="btn-action">Interactive Action Test</button>
      <div id="result"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
